[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Astro 5 needs Node 18.17+; pin to a current LTS so local and CI match.
  NODE_VERSION = "22"

# Persist Astro's encoded-image cache between builds.
#
# Without this, every deploy re-encodes every responsive variant from the
# source JPEGs. Measured cold on this project: 598s when AVIF was still being
# generated, which is why the site now ships WebP only. The cache is keyed on
# the source file, so changing or adding a photo re-encodes only that one.
# Safe to drop: a cold cache just means a slow build, never a wrong one.
[[plugins]]
  package = "netlify-plugin-cache"

  [plugins.inputs]
    paths = ["node_modules/.astro"]

# Build a preview for every pull request.
[context.deploy-preview]
  command = "npm run build"

# Long-cache the hashed build assets (fonts, images, CSS). Filenames change
# when contents change, so these are safe to cache indefinitely.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML must revalidate, or content edits won't show up.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
