
  <div data-screen-label="London Areas" style="animation:pageFadeIn .5s cubic-bezier(.16,1,.3,1)">
    <section style="padding:44px 0 0">
      <div style="max-width:1180px;margin:0 auto;padding:0 clamp(18px,4.6vw,40px)">
        <div style="display:flex;gap:10px;font-size:12px;color:#6B7483;margin-bottom:44px">
          <span sc-camel-on-click="{{ go.home }}" style="cursor:pointer">Home</span><span>→</span><span style="color:#101B2D">London</span>
        </div>
        <div style="font-size:11px;font-weight:600;letter-spacing:0.22em;color:#9A5B33;margin-bottom:24px">LONDON PRIVATE AVIATION</div>
        <h1 style="font-family:Spectral,serif;font-weight:300;font-size:clamp(29px,5.2vw,68px);line-height:1.05;letter-spacing:-0.02em;margin:0;max-width:700px;text-wrap:pretty">Private jet charter, by area</h1>
        <p style="font-size:19px;line-height:1.6;color:#3A4859;max-width:620px;margin:30px 0 0">Where you're based shapes which airport and ground transfer makes sense. Full detail is published once verified — Mayfair is live now.</p>
      </div>
    </section>
    <section style="padding:clamp(42px,7.5vw,70px) 0">
      <div style="max-width:1180px;margin:0 auto;padding:0 clamp(18px,4.6vw,40px);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:18px">
        <sc-for list="{{ londonAreas }}" as="l" hint-placeholder-count="15">
          <div sc-camel-on-click="{{ l.on }}" style="cursor:pointer;border-top:1px solid rgba(16,27,45,0.16);padding-top:16px" style-hover="border-top:1px solid #9A5B33">
            <div style="font-family:Spectral,serif;font-size:19px">{{ l.name }}</div>
          </div>
        </sc-for>
      </div>
    </section>
  </div>
